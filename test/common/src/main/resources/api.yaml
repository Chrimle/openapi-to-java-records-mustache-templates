openapi: 3.0.0
info:
  title: Example OpenAPI Spec.
  description: An example OpenAPI-spec to generate example Java records.
  version: 0.0.1

servers:
  - url: http://localhost/
    description: Irrelevant

paths:
  /ignore:
    get:
      summary: Ignore
      description: Irrelevant
      responses:
        '200':
          description: OK

components:
  schemas:
    RecordWithRequiredFieldsOfEachType:
      type: object
      description: Example of a Record with fields of each type
      required:
        - field1
        - field2
        - field3
        - field4
        - field5
        - field6
        - field7
        - field8
      properties:
        field1:
          type: boolean
          description: a Boolean field
        field2:
          type: string
          description: a String field
        field3:
          type: integer
          description: an Integer field
        field4:
          type: number
          description: a Number field
        field5:
          type: array
          description: an Array of Boolean field
          items:
            type: boolean
        field6:
          type: array
          description: a Set field
          uniqueItems: true
          items:
            type: boolean
        field7:
          description: an ExampleRecord field
          $ref: '#/components/schemas/ExampleRecord'
        field8:
          description: an ExampleEnum field
          $ref: '#/components/schemas/ExampleEnum'
    RecordWithNullableFieldsOfEachType:
      type: object
      description: Example of a Record with fields of each type
      required:
        - field1
        - field2
        - field3
        - field4
        - field5
        - field6
      properties:
        field1:
          type: boolean
          description: a Boolean field
          nullable: true
        field2:
          type: string
          description: a String field
          nullable: true
        field3:
          type: integer
          description: an Integer field
          nullable: true
        field4:
          type: number
          description: a Number field
          nullable: true
        field5:
          type: array
          description: an Array of Boolean field
          nullable: true
          items:
            type: boolean
        field6:
          type: array
          description: a Set field
          uniqueItems: true
          nullable: true
          items:
            type: boolean
        field7:
          description: an ExampleNullableRecord field
          $ref: '#/components/schemas/ExampleNullableRecord'
        field8:
          description: an ExampleNullableEnum field
          nullable: true
          $ref: '#/components/schemas/ExampleNullableEnum'
    ExampleRecordWithCollectionsOfRecords:
      type: object
      description: Example of a Record with collections of records.
      required:
        - requiredRecordList
        - requiredRecordSet
      properties:
        optionalRecordList:
          type: array
          description: Optional field
          items:
            $ref: '#/components/schemas/ExampleRecord'
        requiredRecordList:
          type: array
          description: Required field
          items:
            $ref: '#/components/schemas/ExampleRecord'
        optionalRecordSet:
          type: array
          description: Another Optional field
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ExampleRecord'
        requiredRecordSet:
          type: array
          description: Another required field
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ExampleRecord'
    ExampleRecordOneImplements:
      type: object
      description: Example of an Record which implements an interface.
      properties:
        field1:
          type: boolean
          description: a boolean field
      x-implements:
        - io.github.chrimle.o2jrm.test.interfaces.TestInterfaceOne
    ExampleRecordTwoImplements:
      type: object
      description: Example of an Record which implements two interfaces.
      properties:
        field1:
          type: boolean
          description: a boolean field
      x-implements:
        - io.github.chrimle.o2jrm.test.interfaces.TestInterfaceOne
        - io.github.chrimle.o2jrm.test.interfaces.TestInterfaceTwo
    ExampleRecord:
      type: object
      description: Example of a Record
      properties:
        field1:
          type: boolean
          description: a boolean field
    ExampleNullableRecord:
      type: object
      description: Example of a Record
      nullable: true
      properties:
        field1:
          type: boolean
          description: a boolean field
    DeprecatedExampleRecord:
      type: object
      deprecated: true
      description: Example of a deprecated Record
      properties:
        field1:
          type: boolean
          description: a boolean field
    ExampleRecordWithExtraFieldAnnotations:
      type: object
      description: Example of a Record with fields with `x-field-extra-annotations`.
      properties:
        oneAnnotationAsInline:
          type: boolean
          description: Setting ONE annotation, using inlined.
          x-field-extra-annotation: '@io.github.chrimle.o2jrm.test.annotations.TestFieldExtraAnnotationOne'
        oneAnnotationAsNewLine:
          type: boolean
          description: Setting ONE annotation, using newlines.
          x-field-extra-annotation: |-
            @io.github.chrimle.o2jrm.test.annotations.TestFieldExtraAnnotationOne
        oneAnnotationAsList:
          type: boolean
          description: Setting ONE annotation, using list.
          x-field-extra-annotation:
            - '@io.github.chrimle.o2jrm.test.annotations.TestFieldExtraAnnotationOne'
        oneAnnotationAsArray:
          type: boolean
          description: Setting ONE annotation, using array.
          x-field-extra-annotation: [
            '@io.github.chrimle.o2jrm.test.annotations.TestFieldExtraAnnotationOne'
          ]
        twoAnnotationsAsNewLine:
          type: boolean
          description: Setting TWO annotations, using newlines.
          x-field-extra-annotation: |-
            @io.github.chrimle.o2jrm.test.annotations.TestFieldExtraAnnotationOne
            @io.github.chrimle.o2jrm.test.annotations.TestFieldExtraAnnotationTwo
        twoAnnotationsAsList:
          type: boolean
          description: Setting TWO annotations, using list.
          x-field-extra-annotation:
            - '@io.github.chrimle.o2jrm.test.annotations.TestFieldExtraAnnotationOne'
            - '@io.github.chrimle.o2jrm.test.annotations.TestFieldExtraAnnotationTwo'
        twoAnnotationsAsArray:
          type: boolean
          description: Setting TWO annotations, using array.
          x-field-extra-annotation: [
            '@io.github.chrimle.o2jrm.test.annotations.TestFieldExtraAnnotationOne',
            '@io.github.chrimle.o2jrm.test.annotations.TestFieldExtraAnnotationTwo'
          ]
    ExampleRecordWithOneExtraAnnotation:
      type: object
      description: Example of a Record with an extra annotation
      x-class-extra-annotation: '@io.github.chrimle.o2jrm.test.annotations.TestExtraAnnotation'
      properties:
        field1:
          type: boolean
          description: a boolean field with an extra field annotation
          x-field-extra-annotation: '@io.github.chrimle.o2jrm.test.annotations.TestFieldExtraAnnotationOne'
        field2:
          type: boolean
          description: a boolean field with two extra field annotations
          x-field-extra-annotation: |-
            @io.github.chrimle.o2jrm.test.annotations.TestFieldExtraAnnotationOne
            @io.github.chrimle.o2jrm.test.annotations.TestFieldExtraAnnotationTwo
    ExampleRecordWithTwoExtraAnnotations:
      type: object
      description: Example of a Record with two extra annotations
      x-class-extra-annotation: |-
        @io.github.chrimle.o2jrm.test.annotations.TestExtraAnnotation
        @io.github.chrimle.o2jrm.test.annotations.TestExtraAnnotationTwo
      properties:
        field1:
          type: boolean
          description: a boolean field
    ExampleImplementsEnum:
      type: string
      description: Example of an Enum which implements an interface.
      enum:
        - ENUM1
        - ENUM2
        - ENUM3
      x-implements:
        - io.github.chrimle.o2jrm.test.interfaces.TestInterfaceOne
    ExampleTwoImplementsEnum:
      type: string
      description: Example of an Enum which implements two interfaces.
      enum:
        - ENUM1
        - ENUM2
        - ENUM3
      x-implements:
        - io.github.chrimle.o2jrm.test.interfaces.TestInterfaceOne
        - io.github.chrimle.o2jrm.test.interfaces.TestInterfaceTwo
    ExampleEnum:
      type: string
      description: Example of an Enum
      enum:
        - ENUM1
        - ENUM2
        - ENUM3
      x-enum-descriptions:
        - Some description of ENUM1
        - Some description of ENUM2
        - Some description of ENUM3
    ExampleNullableEnum:
      type: string
      description: Example of an Enum
      nullable: true
      enum:
        - ENUM1
        - ENUM2
        - ENUM3
      x-enum-descriptions:
        - Some description of ENUM1
        - Some description of ENUM2
        - Some description of ENUM3
    ExampleUriEnum:
      type: string
      format: uri
      description: Example of an Enum with URI values
      enum:
        - "https://github.com/Chrimle/openapi-to-java-records-mustache-templates"
        - "https://chrimle.github.io/openapi-to-java-records-mustache-templates/"
    ExampleEnumWithIntegerValues:
      type: integer
      description: Example of an Enum with integer values
      enum:
        - 100
        - 200
        - 300
        - 400
        - 500
    DeprecatedExampleEnum:
      type: string
      deprecated: true
      description: Example of a deprecated Enum
      enum:
        - ENUM1
        - ENUM2
        - ENUM3
    EnumWithDuplicateValues:
      type: string
      description: Example of an Enum with duplicate values
      enum:
        - EXAMPLE
        - Example
    RecordWithInnerEnums:
      type: object
      description: Example of a Record with inner enum classes
      properties:
        exampleInner:
          type: string
          description: Example of an inner enum class
          enum:
            - ENUM1
            - ENUM2
            - ENUM3
          x-enum-descriptions:
            - Some description of ENUM1
            - Some description of ENUM2
            - Some description of ENUM3
        exampleInnerTwo:
          type: integer
          description: Example of another inner enum class with integer values
          enum:
            - 404
            - 501
            - 503
        exampleInnerThree:
          type: string
          format: uri
          description: Example of another inner enum class with URI values
          enum:
            - "https://github.com/Chrimle/openapi-to-java-records-mustache-templates"
            - "https://chrimle.github.io/openapi-to-java-records-mustache-templates/"
    RecordWithAllConstraints:
      type: object
      description: Example of a Record which has fields with constraints
      required:
        - booleanRequired
        - booleanRequiredDefault
        - booleanRequiredNullable
        - stringRequired
        - stringRequiredNullable
        - stringRequiredPattern
        - arrayRequiredNullable
        - arrayUniqueRequired
        - arrayUniqueRequiredNullable
        - longRequired
        - longRequiredNullable
        - bigDecimalRequired
        - bigDecimalRequiredNullable
      properties:
        ### BOOLEAN FIELDS ###
        booleanStandard:
          description: "Non-required, non-nullable Boolean field."
          type: boolean
        booleanDefault:
          description: "Non-required, non-nullable Boolean with a default value."
          type: boolean
          default: true
        booleanNullable:
          description: "Non-required, nullable Boolean field."
          type: boolean
          nullable: true
        booleanRequired:
          description: "Required, non-nullable Boolean field."
          type: boolean
        booleanRequiredDefault:
          description: "Required, non-nullable Boolean field with a default value."
          type: boolean
          default: true
        booleanRequiredNullable:
          description: "Required, nullable Boolean field."
          type: boolean
          nullable: true
        ### STRING FIELDS ###
        stringStandard:
          description: "Non-required, non-nullable String field."
          type: string
        stringDefault:
          description: "Non-required, non-nullable String field with a default value."
          type: string
          default: 'someDefaultValue'
        stringNullable:
          description: "Non-required, nullable String field."
          type: string
          nullable: true
        stringRequired:
          description: "Required, non-nullable String field."
          type: string
        stringRequiredNullable:
          description: "Required, nullable String field."
          type: string
          nullable: true
        stringRequiredPattern:
          description: "Required, non-nullable String field with a RegEx-pattern."
          type: string
          pattern: '^\d{3}-\d{2}-\d{4}$'
        stringEmailFormat:
          description: "Non-required, non-nullable String field with Email format."
          type: string
          format: email
        stringUuidFormat:
          description: "Non-required, non-nullable UUID field."
          type: string
          format: uuid
        stringMinLength:
          description: "Non-required, non-nullable String field with minLength: 3."
          type: string
          minLength: 3
        stringMaxLength:
          description: "Non-required, non-nullable String field with maxLength: 7."
          type: string
          maxLength: 7
        stringMinAndMaxLength:
          description: "Non-required, non-nullable String with minLength: 3 and maxLength: 7."
          type: string
          minLength: 3
          maxLength: 7
        ### ARRAY FIELDS ###
        arrayNullable:
          description: "Non-required, nullable List."
          type: array
          nullable: true
          items:
            type: string
        arrayRequiredNullable:
          description: "Required, nullable List."
          type: array
          nullable: true
          items:
            type: string
        arrayMinItems:
          description: "Non-required, non-nullable List with minItems: 1."
          type: array
          minItems: 1
          items:
            type: string
        arrayMaxItems:
          description: "Non-required, non-nullable List with maxItems: 10."
          type: array
          maxItems: 10
          items:
            type: string
        arrayMinAndMaxItems:
          description: "Non-required, non-nullable List with minItems: 1 and maxItems: 10."
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
        ### SET FIELDS ###
        arrayUniqueStandard:
          description: "Non-required, non-nullable Set."
          type: array
          uniqueItems: true
          items:
            type: string
        arrayUniqueRequired:
          description: "Required, non-nullable Set."
          type: array
          uniqueItems: true
          items:
            type: string
        arrayUniqueNullable:
          description: "Non-required, nullable Set."
          type: array
          nullable: true
          uniqueItems: true
          items:
            type: string
        arrayUniqueRequiredNullable:
          description: "Required, nullable Set."
          type: array
          nullable: true
          uniqueItems: true
          items:
            type: string
        ### INTEGER FIELDS ###
        intMinimum:
          description: "Non-required, non-nullable Integer with minimum: 18."
          type: integer
          minimum: 18
        intMaximum:
          description: "Non-required, non-nullable Integer with maximum: 100."
          type: integer
          maximum: 100
        intMinimumAndMaximum:
          description: "Non-required, non-nullable Integer with minimum: 0 and maximum: 100."
          type: integer
          minimum: 0
          maximum: 100
        ### int64 / LONG FIELDS ###
        longStandard:
          description: "Non-required, non-nullable Long."
          type: integer
          format: int64
        longNullable:
          description: "Non-required, nullable Long."
          type: integer
          format: int64
          nullable: true
        longRequired:
          description: "Required, non-nullable Long."
          type: integer
          format: int64
        longRequiredNullable:
          description: "Required, nullable Long."
          type: integer
          format: int64
          nullable: true
        longMinimum:
          description: "Non-required, non-nullable Long with minimum: 18."
          type: integer
          format: int64
          minimum: 18
        longMaximum:
          description: "Non-required, non-nullable Long with maximum: 100."
          type: integer
          format: int64
          maximum: 100
        longMinimumAndMaximum:
          description: "Non-required, non-nullable Long with minimum: 0 and maximum: 100."
          type: integer
          format: int64
          minimum: 0
          maximum: 100
        ### NUMBER FIELDS ###
        bigDecimalStandard:
          description: "Non-required, non-nullable BigDecimal."
          type: number
        bigDecimalNullable:
          description: "Non-required, nullable BigDecimal."
          type: number
          nullable: true
        bigDecimalRequired:
          description: "Required, non-nullable BigDecimal."
          type: number
        bigDecimalRequiredNullable:
          description: "Required, nullable BigDecimal."
          type: number
          nullable: true
        bigDecimalMinimum:
          description: "Non-required, non-nullable BigDecimal with minimum: 0."
          type: number
          minimum: 0
        bigDecimalMaximum:
          description: "Non-required, non-nullable BigDecimal with maximum: 100."
          type: number
          maximum: 100
        bigDecimalMinimumAndMaximum:
          description: "Non-required, non-nullable BigDecimal with minimum: 0 and maximum: 100."
          type: number
          minimum: 0
          maximum: 100
